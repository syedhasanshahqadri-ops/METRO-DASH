<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1b3a;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 0;font-weight:800;font-size:clamp(18px,3vw,28px);text-shadow:0 2px 6px #000;pointer-events:none}
#hud button{pointer-events:auto;background:#0006;border:0;color:#fff;border-radius:10px;font-size:20px;padding:4px 12px}
#pu{position:fixed;top:52px;left:14px;font-weight:700;text-shadow:0 2px 4px #000;line-height:1.5;white-space:pre}
#ui{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000a;text-align:center}
#ui.on{display:flex}
h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:3px;color:#ffd23f;text-shadow:0 4px 0 #e63946}
button{font:inherit;font-weight:700;color:#fff;background:#3a3a7a;border:0;border-radius:14px;padding:10px 22px;cursor:pointer}
button.big{background:#e63946;font-size:26px;padding:12px 50px}
button.dot{width:44px;height:44px;padding:0;border:3px solid #fff0;border-radius:50%}
button.dot.on{border-color:#fff}
.row{display:flex;align-items:center;gap:12px}
input{font:inherit;font-size:22px;text-align:center;padding:10px;border-radius:12px;border:0;width:230px;user-select:text;-webkit-user-select:text}
small{opacity:.75;max-width:420px;padding:0 12px}
#bn{position:fixed;left:50%;top:24%;transform:translate(-50%,0);opacity:0;font-size:clamp(30px,7vw,56px);font-weight:900;text-shadow:0 4px 0 #0008,0 0 20px currentColor;pointer-events:none;white-space:nowrap}
#bn.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}70%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-60px)}}
#ui{background:radial-gradient(circle at 50% 40%,#2b1a5a99,#050514dd)}
h1{background:linear-gradient(#fff3a0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #e63946;filter:drop-shadow(0 4px 0 #8a1c28);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-1deg)}}
button{background:linear-gradient(#5a5ad0,#3a3a9a);box-shadow:0 4px 0 #1c1c5a;transition:transform .1s}
button:active{transform:translateY(3px)}
button.big{background:linear-gradient(#ff5d6c,#d62839);box-shadow:0 5px 0 #7a1222,0 0 24px #ff4d6a88;animation:pl 1.4s infinite}
@keyframes pl{50%{transform:scale(1.06)}}
#hud div{background:#0007;padding:4px 14px;border-radius:20px}
#hud div:empty{display:none}
.sh{max-height:58vh;overflow:auto;width:min(94vw,520px);display:flex;flex-direction:column;gap:8px;padding:4px}
.it{display:flex;justify-content:space-between;align-items:center;background:#0009;border-radius:12px;padding:8px 12px;text-align:left;gap:10px}
.it small{padding:0;opacity:.8}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="hud">
<div id="sc"></div>
<div id="co"></div>
<button id="pb">⏸</button>
</div>

<div id="pu"></div>
<div id="bn"></div>
<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>

</body>
